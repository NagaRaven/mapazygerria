version: '3.8'

services:
  backend:
    build: ./backend
    container_name: zygerria_backend
    restart: always
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      FRONTEND_URL: ${FRONTEND_URL}
    volumes:
      - db_data:/app/data
      - uploads_data:/app/uploads

volumes:
  db_data:
  uploads_data:
